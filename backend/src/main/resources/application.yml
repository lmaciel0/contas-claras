spring:
  application:
    name: contas-claras
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # O session pooler do Supabase aceita 15 conexões no total. Cada instância da API abre no máximo 2
      # (8 instâncias já somam 16, acima do limite), então a conexão ociosa é devolvida em 10 s em vez dos
      # 10 min padrão do Hikari; com minimum-idle 0, nenhuma instância parada segura conexão.
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 10000
  mail:
    # Gmail com senha de app. Sem MAIL_USERNAME o envio fica desligado e a API responde 503.
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  # Endereço público do front-end, usado nos links dos e-mails. Sem valor padrão de propósito: vem do ambiente
  # (o padrão local fica em application-dev.yml).
  url: ${APP_URL}
  jwt:
    # Segredo HS256, no mínimo 32 bytes. Sempre vem do ambiente; não há valor padrão de propósito.
    secret: ${JWT_SECRET}
  google:
    # Client ID OAuth do Google (audience do ID token). Vazio desliga o login com Google.
    client-id: ${GOOGLE_CLIENT_ID:}
  cookie:
    secure: true

server:
  # Vercel (e qualquer PaaS) define PORT; sem ela, 8080.
  port: ${PORT:8080}
  forward-headers-strategy: framework
