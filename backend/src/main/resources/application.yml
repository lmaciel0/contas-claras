spring:
  application:
    name: aprumo
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # O session pooler do Supabase aceita 15 conexões no total. Estes valores são os padrões (local e testes):
      # no Render o pool vem de SPRING_DATASOURCE_HIKARI_* (render.yaml), dimensionado para a API sempre ligada.
      # Aqui, cada instância abre no máximo 2 e devolve a conexão ociosa em 10 s, para várias instâncias
      # efêmeras não esgotarem o limite do pooler.
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 10000
  mail:
    # Gmail com senha de app. Sem MAIL_USERNAME o envio fica desligado e a API responde 503.
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  # Endereço público do front-end, usado nos links dos e-mails. Sem valor padrão de propósito: vem do ambiente
  # (o padrão local fica em application-dev.yml).
  url: ${APP_URL}
  jwt:
    # Segredo HS256, no mínimo 32 bytes. Sempre vem do ambiente; não há valor padrão de propósito.
    secret: ${JWT_SECRET}
  google:
    # Client ID OAuth do Google (audience do ID token). Vazio desliga o login com Google.
    client-id: ${GOOGLE_CLIENT_ID:}
  cookie:
    secure: true
  saldo:
    # Primeiro mês (AAAA-MM) em que o saldo do Itaú passa a ser calculado; antes dele o saldo fica inativo.
    inicio: 2026-11

server:
  # O Render (e qualquer PaaS) define PORT; sem ela, 8080.
  port: ${PORT:8080}
  # forward-headers-strategy explícito em none, de propósito. Sem ele, o padrão do Boot muda para native quando
  # detecta uma plataforma de nuvem (CloudPlatform, ex. Kubernetes), e o RemoteIpValve do Tomcat consumiria e
  # reescreveria o X-Forwarded-For antes do nosso código, quebrando a contagem do XFF cru em IpDoCliente.
  # A estratégia "framework" também não serve: reescreveria getRemoteAddr() com o IP mais à esquerda do XFF,
  # que o cliente forja. O XFF é lido cru em IpDoCliente.
  forward-headers-strategy: none

aprumo:
  proxy:
    # Segredo que o rewrite da Vercel envia em X-Aprumo-Origem. Com ele, IpDoCliente sabe que há um salto a mais
    # (Vercel) antes da borda do Render. Vazio: nenhum pedido é tratado como vindo da Vercel.
    segredo-origem: ${ORIGEM_SEGREDO:}
