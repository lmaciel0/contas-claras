# Postgres local para desenvolvimento (combina com backend/src/main/resources/application-dev.yml).
#   docker compose up -d
#   cd backend && ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
services:
  postgres:
    image: postgres:17-alpine
    container_name: aprumo-db
    environment:
      POSTGRES_DB: aprumo
      POSTGRES_USER: aprumo
      POSTGRES_PASSWORD: aprumo
    ports:
      # Só em localhost: o banco local tem senha fraca e não deve ficar exposto na rede.
      - "127.0.0.1:5432:5432"
    volumes:
      - aprumo-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aprumo -d aprumo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aprumo-dados:
