# Postgres local para desenvolvimento (combina com backend/src/main/resources/application-dev.yml).
#   docker compose up -d
#   cd backend && ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
services:
  postgres:
    image: postgres:17-alpine
    container_name: contas-claras-db
    environment:
      POSTGRES_DB: contasclaras
      POSTGRES_USER: contas
      POSTGRES_PASSWORD: contas
    ports:
      - "5432:5432"
    volumes:
      - contas-claras-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contas -d contasclaras"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  contas-claras-dados:
