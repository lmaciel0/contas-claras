name: CI

on:
  push:
  pull_request:

# Cancela a execução anterior da mesma branch quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # O Docker já vem no runner ubuntu: os testes de integração sobem o Postgres via Testcontainers.
      - name: Build e testes
        run: cd backend && ./mvnw -q verify
